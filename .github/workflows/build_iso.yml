on: push
name: build output file
defaults:
  run:
    shell: bash
    working-directory: .
jobs:
  build_output:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          sudo \
          mmdebstrap \
          squashfs-tools \
          dosfstools \
          dpkg \
          xorriso \
          isolinux \
          parted \
          syslinux-efi \
          syslinux \
          grub-efi-amd64 \
          grub-efi-amd64-bin \
          binutils \
          mtools \
          debian-archive-keyring \
          udev \
          wget \
          libguestfs-tools \
          libguestfs-dev \
          supermin \
          fakeroot \
          fakechroot
      - name: Dotenv Action
        uses: falti/dotenv-action@v1.2
        id: dotenv
        with:
          export-variables: true
      # - name: Fix libguestfs permissions
      #   run: sudo chmod 0666 /dev/kvm || true
      - name: build amd64
        env:
          MISO_ARCH: amd64
        run: sudo ./miso.sh
        shell: bash
      # i386 CI is disabled because I couldn't get QT (either 5 or 6)to work on a modern 32bit release of debian
      #- name: build i386
      #  env:
      #    MISO_ARCH: i386
      #  run: ./miso.sh
      #  shell: bash
      - uses: ncipollo/release-action@v1.21
        with:
          artifacts: ./build/*.{iso,img}
          allowUpdates: true
          prerelease: true
          draft: false
          tag: v${{ steps.dotenv.outputs.version }}-${{ steps.dotenv.outputs.miso_distro_name }}
