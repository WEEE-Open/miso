on: push
name: build output file
defaults:
  run:
    shell: bash
    working-directory: .
jobs:
  build_output:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y mmdebstrap squashfs-tools dosfstools xorriso isolinux parted udev syslinux-efi grub-pc grub-efi-amd64 grub-efi-i386 mtools debian-archive-keyring isolinux syslinux libguestfstools
      - name: Dotenv Action
        uses: falti/dotenv-action@v1.1
        id: dotenv
        with:
          export-variables: true
      - name: build amd64
        env:
          MISO_ARCH: amd64
        run: sudo ./miso.sh
        shell: bash
      # i386 CI is disabled because I couldn't get QT (either 5 or 6)to work on a modern 32bit release of debian
      #- name: build i386
      #  env:
      #    MISO_ARCH: i386
      #  run: ./miso.sh
      #  shell: bash
      - uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ./build/*.iso
            ./build/*.img
          allowUpdates: true
          prerelease: true
          draft: false
          tag: ${{ steps.dotenv.outputs.miso_distro_name }} v${{ steps.dotenv.outputs.version }}
